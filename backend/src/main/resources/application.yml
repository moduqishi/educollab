server:
  port: 8080
spring:
  application:
    name: educollab-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/educollab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:educollab}
    password: ${DB_PASSWORD:educollab}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
app:
  security:
    jwt-secret: ${JWT_SECRET:educollab-demo-jwt-secret-should-be-32-bytes-minimum}
    jwt-ttl-seconds: 86400
  git:
    root: ${GIT_REPO_ROOT:./data/repos}
  file-storage:
    root: ${FILE_STORAGE_ROOT:./data/uploads}
  ai:
    provider: ${AI_PROVIDER:openai-compatible}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
  demo:
    seed-mode: ${DEMO_SEED_MODE:OFF}
management:
  endpoints:
    web:
      exposure:
        include: health,info
