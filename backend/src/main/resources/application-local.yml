server:
  port: 8080
  address: 0.0.0.0
spring:
  datasource:
    # local dev: file-based H2 so data persists across restarts (no docker / no mysql)
    url: jdbc:h2:file:./data/h2/educollab;MODE=MySQL;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

app:
  demo:
    seed-mode: ${DEMO_SEED_MODE:ENSURE_DEMO}
