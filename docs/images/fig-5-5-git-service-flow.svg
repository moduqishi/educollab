.dash { stroke:#222; stroke-width:2; fill:none; stroke-dasharray:8 6; marker-end:url(#arrow); }
.thin { stroke:#222; stroke-width:1.5; fill:none; }
.caption { font-size:20px; font-weight:700; }
.small { font-size:14px; }
.tiny { font-size:12px; }
</style>
