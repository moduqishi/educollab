[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=/var/lib/mysql --socket=/run/mysqld/mysqld.sock --bind-address=127.0.0.1 --port=3306
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:collab]
directory=/app/collab
command=node src/index.js
autostart=true
autorestart=true
environment=COLLAB_PORT="1234",COLLAB_DATA_DIR="/app/data/collab"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
directory=/app/backend
command=/bin/bash -c "until mariadb-admin --socket=/run/mysqld/mysqld.sock ping --silent; do sleep 1; done; exec java -jar /app/backend/app.jar"
autostart=true
autorestart=true
environment=DB_URL="jdbc:mysql://127.0.0.1:3306/educollab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8",DB_USERNAME="educollab",DB_PASSWORD="educollab",JWT_SECRET="educollab-demo-jwt-secret-change-me-32-bytes-minimum",FILE_STORAGE_ROOT="/app/data/uploads",GIT_REPO_ROOT="/app/data/repos"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
